<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Returning to app…</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
           justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: #fff; border-radius: 12px; padding: 32px 40px; text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h2 { color: #1a1a1a; margin: 0 0 8px; }
    p  { color: #666; margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Returning to app…</h2>
    <p>You can close this page if it does not close automatically.</p>
  </div>
  <script>
    // iOS Universal Link / Android App Link intercepts this URL before the page loads.
    // This JS block is a safety-net for browsers where deep-linking is not active.
    // Two apps share this callback URL (the redirect_uri registered with the
    // identity provider is fixed). Each app stamps its own scheme into the
    // `state` param before starting the flow (state is a pure CSRF token the
    // provider only ever echoes back, never validates), so we can read that
    // stamp here and open the correct app directly — no guessing, no race.
    (function () {
      var qs = window.location.search; // ?code=xxx&state=xxx...::app::<scheme>
      var params = new URLSearchParams(qs);
      var state = params.get("state") || "";
      var marker = "::app::";
      var idx = state.indexOf(marker);
      var targetScheme = idx !== -1 ? state.slice(idx + marker.length) : null;

      if (targetScheme) {
        window.location.href = targetScheme + "://auth/individual/callback" + qs;
        return;
      }

      // No stamp (older in-flight session from before this fix) — fall back
      // to trying each app's scheme in turn. If the first attempt opens an
      // app, this tab is backgrounded; the visibilityState check stops the
      // second attempt from firing on top of it and stealing focus back.
      setTimeout(function () {
        window.location.href = "oneconstellationapp://auth/individual/callback" + qs;
      }, 500);

      setTimeout(function () {
        if (document.visibilityState === "hidden") return;
        window.location.href = "oneconstellationapp://auth/individual/callback" + qs;
      }, 1500);
    })();
  </script>
</body>
</html>
